[package]
name = "rust_lib_bluebubbles"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.3.0"
rustpush = { path = "../rustpush", features = ["macos-validation-data", "remote-anisette-v3"] }
keystore = { path = "../rustpush/keystore" }
plist = "1.5.0"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive", "rc"] }
anyhow = "1.0.75"
uniffi = { git = "https://github.com/mozilla/uniffi-rs", features = [ "cli", "tokio" ] }
async-recursion = "1.0.5"
prost = "0.12"
# Only necessary if using Protobuf well-known types:
prost-types = "0.12"
multi_log = "0.1.2"
rand = "0.8.5"
flexi_logger = "0.28.5"
log = "0.4.22"
pretty_env_logger = "0.5.0"
uuid = { version = "1.4.1", features = ["v4"] }
futures = "0.3.30"
base64 = "0.22.1"
sha2 = "0.10.8"
rasn = "0.16.0"
openssl = { version = "0.10.56", features = ["vendored"] }
aes-gcm = "0.10.3"
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
dirs = "5"
heed = "0.20"
chrono = { version = "0.4", features = ["serde"] }
libloading = "0.8"
libc = "0.2"
allo-isolate = "0.1.26"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14.1"

[build-dependencies]
uniffi = { git = "https://github.com/mozilla/uniffi-rs", features = [ "build" ] }
prost-build = { version = "0.12" }

[[bin]]
# This can be whatever name makes sense for your project, but the rest of this tutorial assumes uniffi-bindgen.
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[[bin]]
name = "ob-cli"
path = "src/bin/ob-cli/main.rs"
